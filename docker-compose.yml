version: '3.8'

services:
  # PostgreSQL Database
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: benky-fy-database
    environment:
      POSTGRES_DB: ${DB_NAME:-benkyfy_db}
      POSTGRES_USER: ${DB_USER:-benkyfy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-benkyfy_user} -d ${DB_NAME:-benkyfy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benky-fy-network
    restart: unless-stopped

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: benky-fy-backend
    environment:
      # Database connection
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-benkyfy_db}
      DB_USER: ${DB_USER:-benkyfy_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # Flask configuration
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-changeme}
      PORT: 8080
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # CORS origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
    # depends_on:
      # database:
        # condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./datum:/app/datum:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - benky-fy-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: benky-fy-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      # Backend API URL (internal Docker network)
      FLASK_API_URL: ${FLASK_API_URL:-http://backend:8080}
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - benky-fy-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - comment out if not needed)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: benky-fy-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - benky-fy-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  benky-fy-network:
    driver: bridge
