#docker-compose.yml
services:
  # PostgreSQL Database
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: benkyfy-database
    environment:
      POSTGRES_DB: ${DB_NAME:-benkyfy_db}
      POSTGRES_USER: ${DB_USER:-benkyfy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-benkyfy_user} -d ${DB_NAME:-benkyfy_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benkyfy-network
    restart: unless-stopped

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: benkyfy-backend
    command: ["flask", "run", "--host=0.0.0.0", "--port=8080"]
    environment:
      # Database connection
      DB_HOST: database
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Flask configuration
      FLASK_APP: backend.app
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Flask secret key required}
      PORT: 8080
      # DEBUG_ENV: "true"
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # CORS origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://srv1365980.hstgr.cloud,https://benkyfy.site,https://www.benkyfy.site,http://localhost:3000,http://localhost:80}
      # Enable database seeding
      # ENABLE_DB_SEED: "true"
    depends_on:
      database:
        condition: service_healthy
    # volumes:
      # Mount backend source code for hot reload (Flask auto-reloads in debug mode)
      # - ./backend:/app/backend:delegated
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - benkyfy-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://benkyfy.site
    container_name: benkyfy-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      NEXT_PUBLIC_API_BASE_URL: http://benkyfy.site
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - benkyfy-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - comment out if not needed)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: benkyfy-nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - benkyfy-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  benkyfy-network:
    driver: bridge
